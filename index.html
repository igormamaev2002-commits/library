            <symbol id="ic-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
            <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
            <symbol id="ic-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
            <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
            <symbol id="ic-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
            <symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></symbol>
        </defs>
    </svg>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>
                    </svg>
                </div>
                <h1 class="app-title">Домашняя библиотека</h1>
            </div>

            <div class="header-actions">
                <span id="syncStatus" class="saved">Синхронизировано</span>
                <button class="history-btn" type="button" onclick="openHistory()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"/>
                        <polyline points="12 7 12 12 15.5 14"/>
                    </svg>
                    История
                </button>
            </div>
        </header>

        <!-- ===== ОБЪЕДИНЁННЫЙ ТУЛБАР (ПОИСК + ДОБАВЛЕНИЕ + ФИЛЬТР АВТОРА) ===== -->
        <section class="toolbar-card" aria-label="Поиск и добавление книг">
            <div class="toolbar-main">
                <div class="search-field">
                    <span class="search-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"/>
                            <line x1="20" y1="20" x2="16.2" y2="16.2"/>
                        </svg>
                    </span>
                    <input id="search" type="text" placeholder="Поиск по автору или названию..." oninput="filter()" autocomplete="off" />
                    <button id="searchClear" class="search-clear hidden" type="button" title="Очистить поиск" aria-label="Очистить поиск" onclick="clearSearch()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>

                <button id="toggleAddBtn" class="toggle-add-btn" type="button" aria-expanded="false" aria-controls="addPanel" onclick="toggleAddPanel()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>Добавить книгу</span>
                </button>
            </div>

            <div id="addPanel" class="add-panel">
                <div class="add-panel-inner">
                    <div class="form">
                        <input id="author" type="text" placeholder="Автор" autocomplete="off" />
                        <datalist id="authorSuggestions"></datalist>
                        <input id="book" type="text" placeholder="Название книги" autocomplete="off" />
                        <button class="add" type="button" onclick="add()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                            Добавить
                        </button>
                    </div>
                </div>
            </div>

            <div id="activeFilterBar" class="active-filter-bar hidden">
                <span>Активный фильтр:</span>
                <button type="button" class="filter-chip" onclick="clearAuthorFilter()" title="Сбросить фильтр по автору">
                    <span class="filter-chip-label">Автор:</span>
                    <span id="activeFilterName"></span>
                    <span class="filter-chip-x" aria-hidden="true">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </span>
                </button>
            </div>
        </section>

        <!-- ===== ТАБЛИЦА КНИГ ===== -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Автор / Книга</th>
                        <th>Игорь</th>
                        <th>Ира</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div id="stats"></div>
    </div>

    <!-- ===== МОДАЛКА ИСТОРИИ ===== -->
    <div id="historyModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-header-text">
                    <div class="modal-eyebrow">Журнал библиотеки</div>
                    <h3 id="historyModalTitle">Последние изменения</h3>
                </div>
                <button class="modal-close" type="button" onclick="closeHistory()" aria-label="Закрыть">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div id="historyList" class="modal-body"></div>
        </div>
    </div>

    <!-- ===== МОДАЛКА КНИЖНОЙ КАРТОЧКИ ===== -->
    <div id="bookModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="bookModalTitle">
        <div class="modal-box modal-box--book">
            <div class="modal-header">
                <div class="modal-header-text">
                    <div class="modal-eyebrow">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        Карточка книги
                    </div>
                    <h3 id="bookModalTitle">Книга</h3>
                </div>
                <button class="modal-close" type="button" onclick="closeBookDetails()" aria-label="Закрыть">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div id="bookModalBody" class="modal-body"></div>
        </div>
    </div>

    <script>
        // ===== КОНФИГУРАЦИЯ =====
        const API_URL =
            "https://script.google.com/macros/s/AKfycbyALTvJQJNtiPHVD0412yqehh5M6m_dBsH_rx_Qbl9rah8yOrNzA3evKaHqu50wX8bzmQ/exec";
        let DATA = [];

        const ICONS = {
            edit: `<svg width="15" height="15"><use href="#ic-edit"/></svg>`,
            trash: `<svg width="15" height="15"><use href="#ic-trash"/></svg>`,
            save: `<svg width="15" height="15"><use href="#ic-save"/></svg>`,
            close: `<svg width="14" height="14"><use href="#ic-close"/></svg>`,
            plus: `<svg width="12" height="12"><use href="#ic-plus"/></svg>`,
            note: `<svg width="13" height="13"><use href="#ic-note"/></svg>`,
            filter: `<svg width="13" height="13"><use href="#ic-filter"/></svg>`,
            book: `<svg width="15" height="15"><use href="#ic-book"/></svg>`,
            user: `<svg width="15" height="15"><use href="#ic-user"/></svg>`,
            check: `<svg width="12" height="12"><use href="#ic-check"/></svg>`,
            image: `<svg width="13" height="13"><use href="#ic-image"/></svg>`,
            search: `<svg width="13" height="13"><use href="#ic-search"/></svg>`
        };

        // Генерируем крошечную статическую текстуру бумаги 1 раз в bitmap (без SVG-фильтров и лагов)
        function initPaperGrain() {
            try {
                const size = 96;
                const canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext("2d");
                if (!ctx) return;
                const img = ctx.createImageData(size, size);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const v = Math.random() > 0.5 ? 44 : 185;
                    d[i] = v;
                    d[i + 1] = v > 100 ? 168 : 34;
                    d[i + 2] = v > 100 ? 150 : 30;
                    d[i + 3] = Math.floor(Math.random() * 8); // едва заметное тёплое зерно
                }
                ctx.putImageData(img, 0, 0);
                document.documentElement.style.setProperty("--grain-img", `url(${canvas.toDataURL("image/png")})`);
            } catch (_) {}
        }
        initPaperGrain();

        function escapeHtml(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const syncStatus = document.getElementById('syncStatus');

        function setSyncStatus(state) {
            syncStatus.classList.remove('saving', 'saved', 'error');
            syncStatus.classList.add(state);
            const texts = {
                saving: 'Синхронизация…',
                saved: 'Синхронизировано',
                error: 'Ошибка синхронизации'
            };
            syncStatus.textContent = texts[state] || texts.saved;
            if (state === 'error') {
                clearTimeout(window.syncErrorTimeout);
                window.syncErrorTimeout = setTimeout(() => setSyncStatus('saved'), 3000);
            }
        }

        // ===== РАСКРЫТИЕ ФОРМЫ ДОБАВЛЕНИЯ =====
        const addPanel = document.getElementById('addPanel');
        const toggleAddBtn = document.getElementById('toggleAddBtn');

        function toggleAddPanel(forceState) {
            const willOpen = typeof forceState === 'boolean' ? forceState : !addPanel.classList.contains('open');
            addPanel.classList.toggle('open', willOpen);
            toggleAddBtn.setAttribute('aria-expanded', String(willOpen));
            toggleAddBtn.querySelector('span').textContent = willOpen ? 'Скрыть форму' : 'Добавить книгу';
            if (willOpen) {
                setTimeout(() => authorInput.focus(), 140);
            }
        }

        // ===== ПОДСКАЗКИ АВТОРОВ =====
        function updateAuthorSuggestions() {
            const authors = new Set();
            for (let i = 1; i < DATA.length; i++) {
                const item = DATA[i];
                if (item && item.author) authors.add(item.author);
            }
            const datalist = document.getElementById('authorSuggestions');
            datalist.innerHTML = '';
            for (const author of authors) {
                const option = document.createElement('option');
                option.value = author;
                datalist.appendChild(option);
            }
        }

        const authorInput = document.getElementById('author');
        const bookInput = document.getElementById('book');
        const searchInput = document.getElementById('search');
        const searchClearBtn = document.getElementById('searchClear');

        authorInput.removeAttribute('list');
        authorInput.addEventListener('focus', function() {
            if (this.value.trim() !== '') this.setAttribute('list', 'authorSuggestions');
            else this.removeAttribute('list');
        });
        authorInput.addEventListener('input', function() {
            if (this.value.trim().length >= 1) this.setAttribute('list', 'authorSuggestions');
            else this.removeAttribute('list');
        });

        [authorInput, bookInput].forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') add();
            });
        });

        // ===== ОСНОВНЫЕ ФУНКЦИИ =====
        async function load() {
            setSyncStatus('saving');
            if (!DATA.length) {
                document.getElementById("tbody").innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">Загружаем библиотеку…</td>
                    </tr>
                `;
            }
            try {
                const res = await fetch(API_URL);
                DATA = await res.json();
                updateAuthorSuggestions();
                setSyncStatus('saved');
                applyFilters();
            } catch (err) {
                setSyncStatus('error');
                console.error('Load error:', err);
                if (!DATA.length) {
                    document.getElementById("tbody").innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">Не удалось загрузить список книг</td>
                        </tr>
                    `;
                }
            }
        }

        function groupByAuthor(data) {
            const map = {};
            data.forEach(item => {
                if (!map[item.author]) map[item.author] = [];
                map[item.author].push(item);
            });
            return map;
        }

        function updateActiveFilterBar() {
            const bar = document.getElementById("activeFilterBar");
            const nameEl = document.getElementById("activeFilterName");
            if (activeAuthor) {
                nameEl.textContent = activeAuthor;
                bar.classList.remove("hidden");
            } else {
                bar.classList.add("hidden");
            }
        }

        function clearAuthorFilter() {
            activeAuthor = null;
            applyFilters();
        }

        function clearSearch() {
            clearTimeout(searchDebounceTimer);
            searchInput.value = "";
            currentSearch = "";
            searchClearBtn.classList.add("hidden");
            applyFilters();
            searchInput.focus();
        }

        function render(data) {
            const tbody = document.getElementById("tbody");
            const grouped = groupByAuthor(data);
            const authorsList = Object.keys(grouped);

            if (!authorsList.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">${ICONS.book}</div>
                            <div>Книг по вашему запросу не найдено</div>
                        </td>
                    </tr>
                `;
                updateStats(data);
                return;
            }

            const frag = document.createDocumentFragment();
            let index = 1;

            for (const author of authorsList) {
                const books = grouped[author];
                const authorId = "author_" + index;
                const isFiltered = activeAuthor === author;

                const trAuthor = document.createElement("tr");
                trAuthor.className = "author-row " + authorId + (isFiltered ? " is-active" : "");
                trAuthor.dataset.group = authorId;
                trAuthor.dataset.author = author;
                trAuthor.title = isFiltered
                    ? "Нажмите, чтобы сбросить фильтр по автору"
                    : "Нажмите, чтобы показать только книги этого автора";
                trAuthor.onclick = () => toggle(author);

                trAuthor.innerHTML = `
                    <td class="num-cell">${index++}</td>
                    <td colspan="4" class="author-cell">
                        <div class="author-cell-content">
                            <span class="author-name">${escapeHtml(author)}</span>
                            <span class="author-count" title="Книг у автора">${books.length}</span>
                            <span class="author-filter-hint" aria-hidden="true">${ICONS.filter}</span>
                            <button type="button" class="add-book-btn" onclick="event.stopPropagation(); addBookToAuthor(this.closest('tr').dataset.author, this)">
                                ${ICONS.plus} книга
                            </button>
                        </div>
                    </td>
                `;
                frag.appendChild(trAuthor);

                books.forEach(item => {
                    frag.appendChild(buildBookRow(item, authorId));
                });
            }
            tbody.replaceChildren(frag);
            updateStats(data);
        }

        let activeAuthor = null;
        let currentSearch = "";

        function toggle(authorName) {
            activeAuthor = (activeAuthor === authorName) ? null : authorName;
            applyFilters();
        }

        async function add() {
            const author = authorInput.value.trim();
            const book = bookInput.value.trim();
            if (!author || !book) { alert("Нужен автор и книга"); return; }

            const tempId = Date.now();
            DATA.push({ id: tempId, author, book, igor: false, ira: false });
            updateAuthorSuggestions();
            authorInput.value = "";
            authorInput.removeAttribute('list');
            bookInput.value = "";
            applyFilters();

            setSyncStatus('saving');
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "add", author, book }) });
                setSyncStatus('saved');
                load();
            } catch (err) {
                setSyncStatus('error');
                DATA = DATA.filter(x => x.id !== tempId);
                updateAuthorSuggestions();
                applyFilters();
                alert("Ошибка при добавлении");
            }
        }

        async function remove(id) {
            const item = DATA.find(x => x.id === id);
            const bookName = item ? item.book : "эту книгу";
            if (!confirm(`Удалить «${bookName}»?`)) return;

            const backup = DATA.slice();
            DATA = DATA.filter(x => x.id !== id);
            updateAuthorSuggestions();
            applyFilters();

            setSyncStatus('saving');
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "delete", id }) });
                setSyncStatus('saved');
                load();
            } catch (err) {
                setSyncStatus('error');
                DATA = backup;
                updateAuthorSuggestions();
                applyFilters();
                alert("Ошибка при удалении");
            }
        }

        function buildBookRow(item, authorId) {
            const tr = document.createElement("tr");
            tr.className = authorId;
            tr.dataset.id = item.id;

            const hasAnnotation = item.annotation && item.annotation.trim();
            const annotationIcon = hasAnnotation
                ? `<span class="annotation-icon" title="Открыть аннотацию" onclick="openBookDetails(${item.id})">${ICONS.note}</span>`
                : "";

            tr.innerHTML = `
                <td colspan="2" class="book-cell">
                    <span class="book-title-wrap">
                        <span class="book-title-link" onclick="openBookDetails(${item.id})">${escapeHtml(item.book)}</span>
                        ${annotationIcon}
                    </span>
                </td>
                <td class="check-cell"><input type="checkbox" aria-label="Игорь прочитал" ${item.igor ? "checked" : ""} onchange="toggleRead(${item.id}, 'igor', this.checked)"></td>
                <td class="check-cell"><input type="checkbox" aria-label="Ира прочитала" ${item.ira ? "checked" : ""} onchange="toggleRead(${item.id}, 'ira', this.checked)"></td>
                <td class="actions">
                    <div class="actions-group">
                        <button type="button" class="edit" title="Редактировать" aria-label="Редактировать" onclick="startEdit(${item.id})">${ICONS.edit}</button>
                        <button type="button" class="delete" title="Удалить" aria-label="Удалить" onclick="remove(${item.id})">${ICONS.trash}</button>
                    </div>
                </td>
            `;
            return tr;
        }

        function refreshAnnotationIcon(id) {
            const tr = document.querySelector(`tr[data-id="${id}"]`);
            if (!tr) return;
            const item = DATA.find(x => x.id === id);
            if (!item) return;
            const titleLink = tr.querySelector(".book-title-link");
            if (!titleLink) return;
            const hasAnnotation = item.annotation && item.annotation.trim();
            let iconEl = tr.querySelector(".annotation-icon");
            if (hasAnnotation && !iconEl) {
                iconEl = document.createElement("span");
                iconEl.className = "annotation-icon";
                iconEl.title = "Открыть аннотацию";
                iconEl.innerHTML = ICONS.note;
                iconEl.onclick = () => openBookDetails(id);
                titleLink.after(iconEl);
            } else if (!hasAnnotation && iconEl) {
                iconEl.remove();
            }
        }

        function startEdit(id) {
            const item = DATA.find(x => x.id === id);
            const tr = document.querySelector(`tr[data-id="${id}"]`);
            if (!tr || !item) return;

            tr.classList.add("editing");
            tr.innerHTML = `
                <td class="book-cell" colspan="2">
                    <input class="inline-input" id="edit-author-${id}" value="${escapeHtml(item.author)}" placeholder="Автор" style="margin-bottom:6px">
                    <input class="inline-input" id="edit-book-${id}" value="${escapeHtml(item.book)}" placeholder="Название книги">
                </td>
                <td class="check-cell"><input type="checkbox" aria-label="Игорь прочитал" ${item.igor ? "checked" : ""} onchange="toggleRead(${item.id}, 'igor', this.checked)"></td>
                <td class="check-cell"><input type="checkbox" aria-label="Ира прочитала" ${item.ira ? "checked" : ""} onchange="toggleRead(${item.id}, 'ira', this.checked)"></td>
                <td class="actions">
                    <div class="actions-group">
                        <button type="button" class="save" title="Сохранить" aria-label="Сохранить" onclick="saveEdit(${id})">${ICONS.save}</button>
                        <button type="button" class="cancel-btn" title="Отмена" aria-label="Отмена" onclick="cancelEdit(${id})">${ICONS.close}</button>
                    </div>
                </td>
            `;
            const bookField = document.getElementById(`edit-book-${id}`);
            const authorField = document.getElementById(`edit-author-${id}`);
            bookField.focus();
            [authorField, bookField].forEach(el => {
                el.addEventListener("keydown", e => {
                    if (e.key === "Enter") saveEdit(id);
                    if (e.key === "Escape") cancelEdit(id);
                });
            });
        }

        async function cancelEdit(id) { applyFilters(); }

        async function saveEdit(id) {
            const author = document.getElementById(`edit-author-${id}`).value.trim();
            const book = document.getElementById(`edit-book-${id}`).value.trim();
            if (!author || !book) { alert("Нужен автор и книга"); return; }

            const item = DATA.find(x => x.id === id);
            const backup = { ...item };
            item.author = author;
            item.book = book;
            updateAuthorSuggestions();
            applyFilters();

            setSyncStatus('saving');
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "update", id, author, book }) });
                setSyncStatus('saved');
            } catch (err) {
                setSyncStatus('error');
                Object.assign(item, backup);
                updateAuthorSuggestions();
                applyFilters();
                alert("Ошибка при редактировании");
            }
        }

        async function toggleRead(id, field, value) {
            const item = DATA.find(x => x.id === id);
            const backup = item[field];
            item[field] = value;
            updateStats(getFilteredData());

            setSyncStatus('saving');
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "toggle", id, field, value }) });
                setSyncStatus('saved');
            } catch (err) {
                setSyncStatus('error');
                item[field] = backup;
                updateStats(getFilteredData());
                alert("Ошибка при изменении");
            }
        }

        let searchDebounceTimer = null;

        function filter() {
            const val = searchInput.value;
            searchClearBtn.classList.toggle("hidden", !val.length);
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                currentSearch = val.toLowerCase();
                applyFilters();
            }, 90);
        }

        function getFilteredData() {
            let data = DATA.slice(1);
            if (activeAuthor) {
                data = data.filter(item => item.author === activeAuthor);
            } else if (currentSearch) {
                data = data.filter(item => (item.author + " " + item.book).toLowerCase().includes(currentSearch));
            }
            return data;
        }

        function applyFilters() {
            updateActiveFilterBar();
            render(getFilteredData());
        }

        function updateStats(data) {
            const booksCount = data.length;
            const authors = new Set(data.map(item => item.author));
            const authorsCount = authors.size;
            const igorRead = data.filter(item => item.igor).length;
            const iraRead = data.filter(item => item.ira).length;
            const igorPct = booksCount ? Math.round((igorRead / booksCount) * 100) : 0;
            const iraPct = booksCount ? Math.round((iraRead / booksCount) * 100) : 0;

            document.getElementById("stats").innerHTML = `
                <div class="stats-summary">
                    <div class="stats-totals">
                        <span class="stat-pill">${ICONS.book} Книг: <strong>${booksCount}</strong></span>
                        <span class="stat-pill">${ICONS.user} Авторов: <strong>${authorsCount}</strong></span>
                    </div>
                    <div class="read-stats">
                        <div class="read-badge">
                            <div class="read-badge-top">
                                <span class="read-badge-name">Игорь</span>
                                <span class="read-badge-val"><strong>${igorRead}</strong> из ${booksCount} (${igorPct}%)</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${igorPct}%"></div>
                            </div>
                        </div>
                        <div class="read-badge">
                            <div class="read-badge-top">
                                <span class="read-badge-name">Ира</span>
                                <span class="read-badge-val"><strong>${iraRead}</strong> из ${booksCount} (${iraPct}%)</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${iraPct}%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function addBookToAuthor(author, btn) {
            const authorRow = btn.closest("tr");
            const existingForm = authorRow.nextElementSibling;
            if (existingForm && existingForm.classList.contains("inline-add-row")) {
                existingForm.remove();
                return;
            }
            document.querySelectorAll(".inline-add-row").forEach(r => r.remove());

            const formId = "inline-add-" + Date.now();
            const tr = document.createElement("tr");
            tr.className = "inline-add-row";
            tr.dataset.author = author;
            tr.innerHTML = `
                <td colspan="2" class="book-cell">
                    <input class="inline-input" id="${formId}" placeholder="Название новой книги…">
                </td>
                <td colspan="2"></td>
                <td class="actions">
                    <div class="actions-group">
                        <button type="button" class="save" title="Добавить" aria-label="Добавить" onclick="submitInlineAdd(this.closest('tr').dataset.author, '${formId}')">${ICONS.save}</button>
                        <button type="button" class="cancel-btn" title="Отмена" aria-label="Отмена" onclick="this.closest('tr').remove()">${ICONS.close}</button>
                    </div>
                </td>
            `;
            authorRow.after(tr);
            const inputEl = document.getElementById(formId);
            inputEl.focus();
            inputEl.addEventListener("keydown", e => {
                if (e.key === "Enter") submitInlineAdd(author, formId);
                if (e.key === "Escape") tr.remove();
            });
        }

        async function submitInlineAdd(author, formId) {
            const input = document.getElementById(formId);
            if (!input) return;
            const book = input.value.trim();
            if (!book) { input.focus(); return; }

            const tr = input.closest("tr");
            const tempId = Date.now();
            DATA.push({ id: tempId, author, book, igor: false, ira: false });
            updateAuthorSuggestions();
            tr.remove();
            applyFilters();

            setSyncStatus('saving');
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "add", author, book }) });
                setSyncStatus('saved');
                load();
            } catch (err) {
                setSyncStatus('error');
                DATA = DATA.filter(x => x.id !== tempId);
                updateAuthorSuggestions();
                applyFilters();
                alert("Ошибка при добавлении");
            }
        }

        // ===== ИСТОРИЯ =====
        async function openHistory() {
            const modal = document.getElementById("historyModal");
            const list = document.getElementById("historyList");
            modal.classList.remove("hidden");
            list.innerHTML = `<div class="history-loading">Загрузка истории…</div>`;
            try {
                const res = await fetch(`${API_URL}?type=history`);
                const history = await res.json();
                renderHistory(history);
            } catch (err) {
                list.innerHTML = `<div class="history-error">Не удалось загрузить историю</div>`;
            }
        }

        function closeHistory() {
            document.getElementById("historyModal").classList.add("hidden");
        }

        function renderHistory(history) {
            const list = document.getElementById("historyList");
            if (!history || !history.length) {
                list.innerHTML = `<div class="history-empty">Изменений пока нет</div>`;
                return;
            }
            list.innerHTML = `<div class="history-list">` + history.map(item => {
                const date = new Date(item.time);
                const formatted = date.toLocaleString("ru-RU", {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                });
                return `
                    <div class="history-item">
                        <div class="history-time">${formatted}</div>
                        <div class="history-desc">${escapeHtml(item.description)}</div>
                    </div>
                `;
            }).join("") + `</div>`;
        }

        // ===== КНИЖНАЯ КАРТОЧКА, ОБЛОЖКИ И АННОТАЦИИ =====
        const COVER_TONES = [
            "cover-tone-terracotta",
            "cover-tone-sage",
            "cover-tone-espresso",
            "cover-tone-ochre"
        ];
        let currentModalBookId = null;

        function sanitizeCoverUrl(raw) {
            let url = String(raw || "").trim();
            if (!url) return "";
            if (!/^https?:\/\//i.test(url)) return "";
            if (/^http:\/\/books\.google\./i.test(url)) {
                url = url.replace(/^http:/i, "https:");
            }
            url = url.replace(/&edge=curl/gi, "");
            return url;
        }

        function getCoverToneClass(item) {
            const key = `${item.author || ""}|${item.book || ""}`;
            let hash = 0;
            for (let i = 0; i < key.length; i++) {
                hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
            }
            return COVER_TONES[Math.abs(hash) % COVER_TONES.length];
        }

        function buildCoverPlaceholderHtml(item) {
            const tone = getCoverToneClass(item);
            return `
                <div class="book-cover-placeholder ${tone}">
                    <div class="cover-ph-author">${escapeHtml(item.author || "")}</div>
                    <div class="cover-ph-title">${escapeHtml(item.book || "")}</div>
                    <div class="cover-ph-rule"></div>
                </div>
            `;
        }

        function setCoverHint(text, state) {
            const hint = document.getElementById("bookCoverHint");
            if (!hint) return;
            hint.textContent = text;
            hint.classList.remove("is-error", "is-ok");
            if (state) hint.classList.add(state);
        }

        function renderCoverPreview(item, rawUrl, showLoadError) {
            const frame = document.getElementById("bookCoverFrame");
            if (!frame) return;
            const url = sanitizeCoverUrl(rawUrl);
            if (!url) {
                frame.innerHTML = buildCoverPlaceholderHtml(item);
                return;
            }
            const img = document.createElement("img");
            img.className = "book-cover-img";
            img.referrerPolicy = "no-referrer";
            img.alt = "Обложка: " + (item.book || "");
            img.src = url;
            img.onerror = () => {
                frame.innerHTML = buildCoverPlaceholderHtml(item);
                if (showLoadError) {
                    setCoverHint("Не удалось загрузить картинку по этой ссылке — проверьте URL.", "is-error");
                }
            };
            img.onload = () => {
                if (showLoadError) {
                    setCoverHint("Картинка загружена — нажмите «Сохранить», чтобы закрепить обложку.", "is-ok");
                }
            };
            frame.replaceChildren(img);
        }

        function openBookDetails(id) {
            const item = DATA.find(x => x.id === id);
            if (!item) return;
            currentModalBookId = id;
            document.getElementById("bookModalTitle").textContent = item.book;

            const hasAnnotation = item.annotation && item.annotation.trim();
            const annotationText = hasAnnotation
                ? escapeHtml(item.annotation)
                : "Аннотация пока не добавлена. Нажмите «Редактировать», чтобы записать краткое описание или впечатления.";

            const hasCover = Boolean(sanitizeCoverUrl(item.cover));

            const body = document.getElementById("bookModalBody");
            body.innerHTML = `
                <div class="book-card-layout">
                    <div class="book-cover-col">
                        <div id="bookCoverFrame" class="book-cover-frame"></div>
                        <button type="button" id="bookCoverTrigger" class="book-cover-trigger" onclick="toggleCoverEditor()">
                            ${ICONS.image} <span>${hasCover ? "Изменить обложку" : "Добавить обложку"}</span>
                        </button>
                    </div>

                    <div class="book-details-col">
                        <div class="book-meta-row">
                            <div class="book-author">${ICONS.user} ${escapeHtml(item.author)}</div>
                            <div class="book-readers">
                                <span class="reader-tag ${item.igor ? "is-read" : ""}">
                                    ${item.igor ? ICONS.check : ""} Игорь: ${item.igor ? "прочитано" : "в планах"}
                                </span>
                                <span class="reader-tag ${item.ira ? "is-read" : ""}">
                                    ${item.ira ? ICONS.check : ""} Ира: ${item.ira ? "прочитано" : "в планах"}
                                </span>
                            </div>
                        </div>

                        <div class="book-annotation-card">
                            <div class="book-annotation-label">Аннотация и заметки</div>
                            <p id="bookAnnotationText" class="book-annotation ${hasAnnotation ? "" : "is-empty"}">${annotationText}</p>
                            <textarea id="bookAnnotationEdit" class="inline-input book-annotation-edit hidden" rows="6" placeholder="Введите аннотацию или заметку о книге…">${escapeHtml(item.annotation || "")}</textarea>
                        </div>

                        <div class="book-modal-actions">
                            <button type="button" class="edit" id="bookAnnotationEditBtn" onclick="startEditAnnotation()">
                                ${ICONS.edit} Редактировать
                            </button>
                            <button type="button" class="cancel-btn hidden" id="bookAnnotationCancelBtn" onclick="cancelEditAnnotation()">
                                Отмена
                            </button>
                            <button type="button" class="save hidden" id="bookAnnotationSaveBtn" onclick="saveAnnotation(${id})">
                                ${ICONS.save} Сохранить
                            </button>
                        </div>
                    </div>
                </div>

                <div id="bookCoverEditor" class="book-cover-editor hidden">
                    <div class="book-cover-editor-label">Обложка книги (ссылка URL)</div>
                    <div class="book-cover-editor-row">
                        <input id="bookCoverInput" class="inline-input" type="url" value="${escapeHtml(item.cover || "")}" placeholder="https://..." oninput="onCoverInputChange(${id})" />
                        <button type="button" id="coverAutoBtn" class="cover-auto-btn" onclick="autoFindCover(${id})">
                            ${ICONS.search} Подобрать
                        </button>
                    </div>
                    <div id="bookCoverHint" class="book-cover-hint">
                        Вставьте ссылку на картинку или нажмите «Подобрать» для поиска на Лабиринте.
                    </div>
                    <div id="coverCandidates" class="cover-candidates hidden"></div>
                    <div class="book-cover-editor-actions">
                        <button type="button" id="bookCoverRemoveBtn" class="editor-action-btn cover-remove-btn ${hasCover ? "" : "hidden"}" onclick="saveCover(${id}, '')">
                            ${ICONS.trash} Убрать обложку
                        </button>
                        <div class="book-cover-editor-right">
                            <button type="button" class="editor-action-btn cancel-btn" onclick="cancelCoverEditor(${id})">Отмена</button>
                            <button type="button" class="editor-action-btn save" onclick="saveCover(${id})">
                                ${ICONS.save} Сохранить
                            </button>
                        </div>
                    </div>
                </div>
            `;

            renderCoverPreview(item, item.cover, false);

            const coverInput = document.getElementById("bookCoverInput");
            if (coverInput) {
                coverInput.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") saveCover(id);
                });
            }

            document.getElementById("bookModal").classList.remove("hidden");
        }

        function closeBookDetails() {
            currentModalBookId = null;
            document.getElementById("bookModal").classList.add("hidden");
        }

        function toggleCoverEditor() {
            const editor = document.getElementById("bookCoverEditor");
            if (!editor) return;
            const willOpen = editor.classList.contains("hidden");
            editor.classList.toggle("hidden", !willOpen);
            if (willOpen) {
                const input = document.getElementById("bookCoverInput");
                if (input) {
                    input.focus();
                    input.select();
                }
            } else if (currentModalBookId !== null) {
                cancelCoverEditor(currentModalBookId);
            }
        }

        function cancelCoverEditor(id) {
            const item = DATA.find(x => x.id === id);
            const editor = document.getElementById("bookCoverEditor");
            const input = document.getElementById("bookCoverInput");
            const candidatesEl = document.getElementById("coverCandidates");
            if (editor) editor.classList.add("hidden");
            if (candidatesEl) {
                candidatesEl.innerHTML = "";
                candidatesEl.classList.add("hidden");
            }
            if (item) {
                if (input) input.value = item.cover || "";
                renderCoverPreview(item, item.cover, false);
            }
            setCoverHint("Вставьте ссылку на картинку или нажмите «Подобрать» для поиска на Лабиринте.", "");
        }

        let coverPreviewTimer = null;
        function onCoverInputChange(id) {
            const item = DATA.find(x => x.id === id);
            const input = document.getElementById("bookCoverInput");
            if (!item || !input) return;
            const val = input.value.trim();
            clearTimeout(coverPreviewTimer);
            coverPreviewTimer = setTimeout(() => {
                if (!val) {
                    renderCoverPreview(item, "", false);
                    setCoverHint("Если сохранить пустое поле, останется обложка-переплёт.", "");
                } else if (!/^https?:\/\//i.test(val)) {
                    setCoverHint("Ссылка должна начинаться с https:// или http://", "is-error");
                } else {
                    renderCoverPreview(item, val, true);
                }
            }, 220);
        }

        function selectCoverCandidate(id, url, btnEl) {
            const item = DATA.find(x => x.id === id);
            const input = document.getElementById("bookCoverInput");
            if (!item || !input) return;
            input.value = url;
            renderCoverPreview(item, url, true);
            document.querySelectorAll("#coverCandidates .cover-candidate-btn").forEach(b => {
                b.classList.toggle("is-selected", b === btnEl);
            });
        }

        async function autoFindCover(id) {
            const item = DATA.find(x => x.id === id);
            const btn = document.getElementById("coverAutoBtn");
            const input = document.getElementById("bookCoverInput");
            const candidatesEl = document.getElementById("coverCandidates");
            if (!item || !btn || !input) return;

            btn.disabled = true;
            if (candidatesEl) {
                candidatesEl.innerHTML = "";
                candidatesEl.classList.add("hidden");
            }
            setCoverHint("Ищем обложку на Лабиринте и Литресе…", "");

            let foundUrl = "";
            let candidates = [];
            try {
                const url =
                    `${API_URL}?type=findCover` +
                    `&author=${encodeURIComponent(item.author || "")}` +
                    `&book=${encodeURIComponent(item.book || "")}`;
                const res = await fetch(url);
                if (res.ok) {
                    const json = await res.json();
                    if (Array.isArray(json.candidates)) {
                        candidates = json.candidates
                            .map(c => ({
                                cover: sanitizeCoverUrl(c.cover),
                                title: c.title || "",
                                source: c.source || ""
                            }))
                            .filter(c => c.cover);
                    }
                    foundUrl = sanitizeCoverUrl(json.cover || (candidates[0] && candidates[0].cover) || "");
                }
            } catch (err) {
                console.error("Cover search error:", err);
            } finally {
                btn.disabled = false;
            }

            if (foundUrl) {
                input.value = foundUrl;
                renderCoverPreview(item, foundUrl, true);
                const src = candidates[0] && candidates[0].source;
                if (src) {
                    setCoverHint(`Обложка найдена (${src}) — проверьте превью и нажмите «Сохранить».`, "is-ok");
                }
                if (candidatesEl && candidates.length > 1) {
                    candidatesEl.innerHTML = "";
                    candidates.forEach((cand, idx) => {
                        const b = document.createElement("button");
                        b.type = "button";
                        b.className = "cover-candidate-btn" + (idx === 0 ? " is-selected" : "");
                        b.title = (cand.title || "Выбрать обложку") + (cand.source ? ` (${cand.source})` : "");
                        b.onclick = () => selectCoverCandidate(id, cand.cover, b);
                        const img = document.createElement("img");
                        img.src = cand.cover;
                        img.referrerPolicy = "no-referrer";
                        img.alt = cand.title || "Вариант обложки";
                        b.appendChild(img);
                        candidatesEl.appendChild(b);
                    });
                    candidatesEl.classList.remove("hidden");
                }
            } else {
                setCoverHint("Обложка не нашлась — можно вставить прямую ссылку вручную.", "is-error");
            }
        }

        async function saveCover(id, explicitValue) {
            const item = DATA.find(x => x.id === id);
            const input = document.getElementById("bookCoverInput");
            if (!item) return;

            const raw = typeof explicitValue === "string" ? explicitValue : (input ? input.value.trim() : "");
            if (raw && !/^https?:\/\//i.test(raw)) {
                setCoverHint("Ссылка должна начинаться с https:// или http://", "is-error");
                if (input) input.focus();
                return;
            }

            const cover = sanitizeCoverUrl(raw);
            const backup = item.cover || "";
            item.cover = cover;

            if (input) input.value = cover;
            renderCoverPreview(item, cover, false);

            const triggerSpan = document.querySelector("#bookCoverTrigger span");
            if (triggerSpan) triggerSpan.textContent = cover ? "Изменить обложку" : "Добавить обложку";
            const removeBtn = document.getElementById("bookCoverRemoveBtn");
            if (removeBtn) removeBtn.classList.toggle("hidden", !cover);
            const editor = document.getElementById("bookCoverEditor");
            if (editor) editor.classList.add("hidden");

            setSyncStatus('saving');
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "updateCover", id, cover })
                });
                setSyncStatus('saved');
            } catch (err) {
                setSyncStatus('error');
                item.cover = backup;
                if (currentModalBookId === id) {
                    renderCoverPreview(item, backup, false);
                    if (triggerSpan) triggerSpan.textContent = backup ? "Изменить обложку" : "Добавить обложку";
                    if (removeBtn) removeBtn.classList.toggle("hidden", !backup);
                }
                alert("Ошибка при сохранении обложки");
            }
        }

        function startEditAnnotation() {
            document.getElementById("bookAnnotationText").classList.add("hidden");
            document.getElementById("bookAnnotationEdit").classList.remove("hidden");
            document.getElementById("bookAnnotationEditBtn").classList.add("hidden");
            document.getElementById("bookAnnotationCancelBtn").classList.remove("hidden");
            document.getElementById("bookAnnotationSaveBtn").classList.remove("hidden");
            document.getElementById("bookAnnotationEdit").focus();
        }

        function cancelEditAnnotation() {
            document.getElementById("bookAnnotationText").classList.remove("hidden");
            document.getElementById("bookAnnotationEdit").classList.add("hidden");
            document.getElementById("bookAnnotationEditBtn").classList.remove("hidden");
            document.getElementById("bookAnnotationCancelBtn").classList.add("hidden");
            document.getElementById("bookAnnotationSaveBtn").classList.add("hidden");
        }

        async function saveAnnotation(id) {
            const textarea = document.getElementById("bookAnnotationEdit");
            const annotation = textarea.value.trim();
            const item = DATA.find(x => x.id === id);
            const backup = item.annotation;
            item.annotation = annotation;
            refreshAnnotationIcon(id);
            closeBookDetails();

            setSyncStatus('saving');
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "updateAnnotation", id, annotation })
                });
                setSyncStatus('saved');
            } catch (err) {
                setSyncStatus('error');
                item.annotation = backup;
                refreshAnnotationIcon(id);
                alert("Ошибка при сохранении аннотации");
            }
        }

        // ===== ЗАКРЫТИЕ МОДАЛОК ПО ESC / КЛИКУ НА ФОН =====
        document.getElementById("bookModal").addEventListener("click", (e) => {
            if (e.target.id === "bookModal") closeBookDetails();
        });
        document.getElementById("historyModal").addEventListener("click", (e) => {
            if (e.target.id === "historyModal") closeHistory();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeHistory();
                closeBookDetails();
            }
        });

        // ===== СТАРТ =====
        load();
    </script>
</body>
</html>
