<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Домашняя библиотека</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FAF6F0'/><path d='M26 30h18c6 0 10 4 10 10v34c-3-3-7-4-12-4H26V30zm48 0H56c-6 0-10 4-10 10v34c3-3 7-4 12-4h16V30z' fill='none' stroke='%23C46D4B' stroke-width='6' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== VARIABLES — БУМАГА И ТЕРРАКОТА ===== */
        :root {
            --bg: #FAF6F0;
            --bg-warm: #F3ECE2;
            --surface: #FFFDF9;
            --surface-2: #F7F1E8;
            --surface-author: #F5EFE6;
            --surface-author-hover: #EEE5D8;
            --surface-author-active: #F6E6DD;

            --ink: #2C221E;
            --ink-soft: #6D5E56;
            --ink-faint: #A4958B;

            --accent: #C46D4B;
            --accent-deep: #A85637;
            --accent-soft: #E4B9A6;
            --accent-wash: #F9ECE5;

            --sage: #6D8B68;
            --sage-deep: #587453;
            --sage-wash: #EAF0E8;

            --amber: #B47E35;
            --amber-wash: #F8EFE0;

            --danger: #AE4F4B;
            --danger-wash: #F7E8E7;

            --line: #EBE1D5;
            --line-strong: #DDD0C1;

            --shadow-sm: 0 2px 8px rgba(44, 34, 30, 0.04);
            --shadow: 0 14px 36px rgba(44, 34, 30, 0.065), 0 2px 6px rgba(44, 34, 30, 0.03);
            --shadow-modal: 0 28px 64px rgba(44, 34, 30, 0.2), 0 4px 16px rgba(44, 34, 30, 0.06);

            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 9px;

            --font-serif: "Lora", Georgia, "Times New Roman", serif;
            --font-sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            margin: 0;
            padding: 32px 20px 44px;
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        @media (max-width: 640px) {
            body {
                padding: 18px 12px 28px;
            }
        }

        /* ===== AMBIENT WARM SUNLIGHT & STATIC PAPER GRAIN ===== */
        .bg-ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            contain: strict;
            transform: translateZ(0);
            background-color: var(--bg);
            background-image:
                var(--grain-img, none),
                radial-gradient(62% 52% at 88% 4%, rgba(242, 207, 174, 0.42) 0%, rgba(242, 207, 174, 0) 70%),
                radial-gradient(54% 48% at 8% 18%, rgba(232, 194, 173, 0.26) 0%, rgba(232, 194, 173, 0) 68%),
                radial-gradient(50% 45% at 78% 92%, rgba(203, 214, 196, 0.22) 0%, rgba(203, 214, 196, 0) 70%),
                linear-gradient(180deg, #FBF7F1 0%, #F8F2E9 100%);
            background-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: var(--accent-wash);
            border: 1px solid rgba(196, 109, 75, 0.22);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .app-title {
            margin: 0;
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.015em;
            line-height: 1.15;
            color: var(--ink);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .app-header {
                margin-bottom: 16px;
            }
            .app-title {
                font-size: 23px;
            }
            .brand-mark {
                width: 36px;
                height: 36px;
                border-radius: 11px;
            }
        }

        /* ===== SYNC STATUS ===== */
        #syncStatus {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            font-weight: 600;
            padding: 7px 13px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ink-soft);
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        #syncStatus::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink-faint);
            flex-shrink: 0;
            transition: background 0.2s;
        }

        #syncStatus.saving {
            color: var(--amber);
            background: var(--amber-wash);
            border-color: rgba(180, 126, 53, 0.25);
        }

        #syncStatus.saving::before {
            background: var(--amber);
            animation: pulseDot 1.2s ease-in-out infinite;
        }

        #syncStatus.saved {
            color: var(--sage-deep);
            background: var(--sage-wash);
            border-color: rgba(109, 139, 104, 0.24);
        }

        #syncStatus.saved::before {
            background: var(--sage);
        }

        #syncStatus.error {
            color: var(--danger);
            background: var(--danger-wash);
            border-color: rgba(174, 79, 75, 0.25);
        }

        #syncStatus.error::before {
            background: var(--danger);
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.8); }
        }

        .history-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line-strong);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-sans);
            transition: border-color 0.18s, background 0.18s, transform 0.12s, box-shadow 0.18s;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }

        .history-btn:hover {
            border-color: var(--accent-soft);
            background: var(--surface-2);
            color: var(--accent-deep);
        }

        .history-btn:active {
            transform: scale(0.98);
        }

        /* ===== UNIFIED TOOLBAR CARD ===== */
        .toolbar-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            padding: 14px 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
        }

        .toolbar-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-field {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: var(--ink-faint);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .search-field input {
            width: 100%;
            padding: 11px 38px 11px 42px;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 14px;
            outline: none;
            transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
        }

        .search-field input::placeholder {
            color: var(--ink-faint);
        }

        .search-field input:focus {
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 109, 75, 0.14);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            width: 26px;
            height: 26px;
            border: none;
            background: transparent;
            color: var(--ink-faint);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }

        .search-clear:hover {
            background: var(--surface-2);
            color: var(--ink);
        }

        .toggle-add-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #FFFDF9;
            padding: 11px 18px;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
            box-shadow: 0 4px 12px rgba(196, 109, 75, 0.22);
        }

        .toggle-add-btn:hover {
            background: var(--accent-deep);
            box-shadow: 0 6px 16px rgba(168, 86, 55, 0.28);
        }

        .toggle-add-btn:active {
            transform: scale(0.98);
        }

        .toggle-add-btn svg {
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .toggle-add-btn[aria-expanded="true"] {
            background: var(--surface-2);
            color: var(--ink);
            border-color: var(--line-strong);
            box-shadow: none;
        }

        .toggle-add-btn[aria-expanded="true"] svg {
            transform: rotate(45deg);
        }

        /* Collapsible Add Form */
        .add-panel {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease, margin-top 0.28s ease;
            margin-top: 0;
        }

        .add-panel.open {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 14px;
        }

        .add-panel-inner {
            overflow: hidden;
        }

        .form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px dashed var(--line-strong);
        }

        .form input {
            flex: 1;
            min-width: 170px;
            padding: 10px 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 14px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }

        .form input::placeholder {
            color: var(--ink-faint);
        }

        .form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 109, 75, 0.14);
        }

        button.add {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: var(--sage);
            color: #FFFDF9;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            transition: background 0.18s, transform 0.12s;
            white-space: nowrap;
        }

        button.add:hover {
            background: var(--sage-deep);
        }

        button.add:active {
            transform: scale(0.98);
        }

        /* Active Author Filter Chip Bar */
        .active-filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            color: var(--ink-soft);
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px 5px 12px;
            background: var(--accent-wash);
            border: 1px solid rgba(196, 109, 75, 0.28);
            color: var(--accent-deep);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .filter-chip:hover {
            background: #F4DFD4;
            border-color: rgba(196, 109, 75, 0.45);
        }

        .filter-chip-label {
            color: var(--ink-soft);
            font-weight: 500;
        }

        .filter-chip-x {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(196, 109, 75, 0.14);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-deep);
            transition: background 0.15s, color 0.15s;
        }

        .filter-chip:hover .filter-chip-x {
            background: var(--accent);
            color: #FFFDF9;
        }

        @media (max-width: 640px) {
            .toolbar-card {
                padding: 12px;
                border-radius: var(--radius-lg);
            }
            .toolbar-main {
                flex-direction: column;
                align-items: stretch;
            }
            .toggle-add-btn {
                width: 100%;
            }
            .form {
                flex-direction: column;
            }
            .form button.add {
                width: 100%;
            }
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 70vh;
            -webkit-overflow-scrolling: touch;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid var(--line);
            contain: layout style paint;
            transform: translateZ(0);
        }

        .table-wrapper::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: transparent;
            margin-top: 44px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 999px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent-soft);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 460px;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg-warm);
            color: var(--ink-soft);
            font-family: var(--font-sans);
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 13px 12px;
            border-bottom: 1px solid var(--line-strong);
            text-align: left;
            white-space: nowrap;
        }

        /* column widths (controlled by thead for fixed layout) */
        thead th:nth-child(1) {
            width: 48px;
            text-align: center;
            padding-left: 10px;
            padding-right: 6px;
        }

        thead th:nth-child(2) {
            width: auto;
        }

        thead th:nth-child(3),
        thead th:nth-child(4) {
            width: 72px;
            text-align: center;
            padding-left: 4px;
            padding-right: 4px;
        }

        thead th:nth-child(5) {
            width: 96px;
            text-align: right;
            padding-right: 16px;
        }

        td {
            padding: 11px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }

        td.num-cell {
            text-align: center;
            color: var(--ink-faint);
            font-size: 12.5px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            padding-left: 10px;
            padding-right: 6px;
        }

        td.author-cell {
            text-align: left;
            padding-right: 14px;
        }

        td.check-cell {
            text-align: center;
            padding-left: 4px;
            padding-right: 4px;
        }

        td.actions {
            text-align: right;
            padding-right: 14px;
            white-space: nowrap;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:not(.author-row):not(.editing):not(.inline-add-row):hover {
            background: var(--surface-2);
        }

        td.book-cell {
            white-space: normal;
            word-break: break-word;
            text-align: left;
            padding-left: 22px;
        }

        /* ===== AUTHOR ROW ===== */
        .author-row {
            background: var(--surface-author);
            cursor: pointer;
        }

        .author-row:hover {
            background: var(--surface-author-hover);
        }

        .author-row.is-active {
            background: var(--surface-author-active);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .author-row td {
            padding-top: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }

        .author-cell-content {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
        }

        .author-name {
            font-family: var(--font-serif);
            font-size: 15.5px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.005em;
        }

        .author-row.is-active .author-name {
            color: var(--accent-deep);
        }

        .author-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 21px;
            padding: 0 7px;
            border-radius: 999px;
            background: rgba(44, 34, 30, 0.06);
            color: var(--ink-soft);
            font-size: 11.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .author-row.is-active .author-count {
            background: rgba(196, 109, 75, 0.16);
            color: var(--accent-deep);
        }

        .author-filter-hint {
            display: inline-flex;
            align-items: center;
            color: var(--ink-faint);
            opacity: 0;
            transition: opacity 0.16s ease, color 0.16s ease;
        }

        .author-row:hover .author-filter-hint,
        .author-row.is-active .author-filter-hint {
            opacity: 1;
        }

        .author-row.is-active .author-filter-hint {
            color: var(--accent);
        }

        /* ===== INLINE ADD BUTTON ===== */
        .add-book-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            padding: 4px 10px;
            background: var(--surface);
            color: var(--accent-deep);
            border: 1px solid rgba(196, 109, 75, 0.28);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-sans);
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
            white-space: nowrap;
        }

        .add-book-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #FFFDF9;
        }

        .add-book-btn:active {
            transform: scale(0.97);
        }

        .inline-add-row td {
            background: var(--sage-wash);
            border-bottom: 1px solid rgba(109, 139, 104, 0.35);
        }

        .inline-add-row .inline-input {
            border-color: rgba(109, 139, 104, 0.55);
        }

        .inline-add-row .inline-input:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(109, 139, 104, 0.18);
        }

        /* ===== BOOK TITLE & ANNOTATION BADGE ===== */
        .book-title-wrap {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .book-title-link {
            cursor: pointer;
            font-family: var(--font-serif);
            color: var(--ink);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.005em;
            transition: color 0.15s;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .book-title-link:hover {
            color: var(--accent-deep);
            border-bottom-color: var(--accent-soft);
        }

        .annotation-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: var(--accent-wash);
            color: var(--accent);
            vertical-align: middle;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .annotation-icon:hover {
            background: var(--accent);
            color: #FFFDF9;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            white-space: nowrap;
        }

        .actions-group {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .actions button {
            width: 31px;
            height: 31px;
            padding: 0;
            border: 1px solid transparent;
            cursor: pointer;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
        }

        .actions button:active {
            transform: scale(0.94);
        }

        .edit {
            background: transparent;
            color: var(--ink-soft);
        }

        .edit:hover {
            background: var(--surface-2);
            border-color: var(--line-strong);
            color: var(--ink);
        }

        .delete {
            background: transparent;
            color: var(--ink-faint);
        }

        .delete:hover {
            background: var(--danger-wash);
            border-color: rgba(174, 79, 75, 0.22);
            color: var(--danger);
        }

        .save {
            background: var(--sage);
            color: #FFFDF9;
        }

        .save:hover {
            background: var(--sage-deep);
        }

        .actions .cancel-btn,
        .cancel-btn {
            background: var(--surface-2);
            color: var(--ink-soft);
            border-color: var(--line-strong);
        }

        .actions .cancel-btn:hover,
        .cancel-btn:hover {
            background: var(--bg-warm);
            color: var(--ink);
        }

        tr.editing td {
            background: var(--accent-wash);
        }

        .inline-input {
            width: 100%;
            padding: 7px 11px;
            border: 1px solid var(--accent-soft);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font-sans);
            outline: none;
            background: var(--surface);
            color: var(--ink);
            transition: border-color 0.18s, box-shadow 0.18s;
        }

        .inline-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 109, 75, 0.16);
        }

        .empty-state {
            text-align: center;
            padding: 44px 20px;
            color: var(--ink-soft);
            font-size: 14.5px;
        }

        .empty-state-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--surface-2);
            color: var(--ink-faint);
            margin-bottom: 10px;
        }

        /* ===== CHECKBOX ===== */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            margin: 0;
            border-radius: 7px;
            border: 1.5px solid var(--line-strong);
            background: var(--surface);
            cursor: pointer;
            position: relative;
            transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease;
            vertical-align: middle;
        }

        input[type="checkbox"]:hover {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(109, 139, 104, 0.14);
        }

        input[type="checkbox"]:active {
            transform: scale(0.92);
        }

        input[type="checkbox"]:checked {
            background: var(--sage);
            border-color: var(--sage);
        }

        input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 46%;
            width: 5px;
            height: 9px;
            border: solid #FFFDF9;
            border-width: 0 2px 2px 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        /* ===== STATS FOOTER ===== */
        #stats {
            margin-top: 18px;
            padding: 18px 20px;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
            color: var(--ink-soft);
        }

        .stats-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stats-totals {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 13.5px;
            color: var(--ink-soft);
        }

        .stat-pill strong {
            color: var(--ink);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-pill svg {
            color: var(--accent);
        }

        .read-stats {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: flex-end;
        }

        .read-badge {
            min-width: 195px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 9px 13px;
            font-size: 12.5px;
            color: var(--ink-soft);
        }

        .read-badge-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .read-badge-name {
            font-weight: 600;
            color: var(--ink);
        }

        .read-badge-val {
            font-variant-numeric: tabular-nums;
            color: var(--ink-soft);
        }

        .read-badge-val strong {
            color: var(--sage-deep);
            font-weight: 700;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: var(--line);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--sage);
            transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @media (max-width: 680px) {
            .stats-summary {
                flex-direction: column;
                align-items: stretch;
            }
            .read-stats {
                justify-content: stretch;
            }
            .read-badge {
                flex: 1;
                min-width: 140px;
            }
        }

        /* ===== UTILITY ===== */
        .hidden {
            display: none;
        }

        /* ===== MODALS (SMOOTH GPU ANIMATIONS) ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(34, 24, 19, 0.48);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal-overlay.hidden {
            display: flex;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .modal-box {
            background: var(--surface);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 540px;
            max-height: 84vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--line);
            transform: translate3d(0, 0, 0) scale(1);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }

        .modal-overlay.hidden .modal-box {
            transform: translate3d(0, 12px, 0) scale(0.975);
        }

        .modal-box--book {
            max-width: 680px;
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            padding: 22px 26px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }

        .modal-header-text {
            min-width: 0;
        }

        .modal-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .modal-header h3 {
            margin: 0;
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: 20px;
            line-height: 1.25;
            color: var(--ink);
            word-break: break-word;
        }

        .modal-box--book .modal-header h3 {
            font-size: 24px;
            letter-spacing: -0.01em;
        }

        .modal-close {
            background: var(--surface-2);
            border: 1px solid var(--line);
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: var(--ink-soft);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .modal-close:hover {
            background: var(--bg-warm);
            color: var(--ink);
            border-color: var(--line-strong);
        }

        .modal-body {
            padding: 20px 26px 24px;
            overflow-y: auto;
        }

        /* ===== BOOK CARD MODAL ===== */
        .book-card-layout {
            display: grid;
            grid-template-columns: 168px minmax(0, 1fr);
            gap: 24px;
            align-items: start;
        }

        .book-cover-col {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .book-cover-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 4px 12px 12px 4px;
            overflow: hidden;
            background: var(--bg-warm);
            box-shadow:
                -2px 0 0 rgba(44, 34, 30, 0.08),
                0 12px 26px rgba(44, 34, 30, 0.16),
                0 2px 6px rgba(44, 34, 30, 0.08);
        }

        /* Деликатный эффект корешка книги */
        .book-cover-frame::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 12px;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.18) 0%,
                rgba(255, 255, 255, 0.16) 34%,
                rgba(0, 0, 0, 0.07) 64%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        .book-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: var(--bg-warm);
        }

        /* Стильная заглушка-переплёт */
        .book-cover-placeholder {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px 16px 18px 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            user-select: none;
        }

        .book-cover-placeholder::before {
            content: "";
            position: absolute;
            inset: 10px 10px 10px 16px;
            border: 1px solid currentColor;
            opacity: 0.24;
            border-radius: 2px 6px 6px 2px;
            pointer-events: none;
        }

        .cover-tone-terracotta {
            background: linear-gradient(155deg, #C46D4B 0%, #9E4F32 100%);
            color: #FBF5EC;
        }

        .cover-tone-sage {
            background: linear-gradient(155deg, #6E8A68 0%, #50694B 100%);
            color: #FAF7F1;
        }

        .cover-tone-espresso {
            background: linear-gradient(155deg, #62473B 0%, #443028 100%);
            color: #F4E9D8;
        }

        .cover-tone-ochre {
            background: linear-gradient(155deg, #DFCCB4 0%, #CBB190 100%);
            color: #2C221E;
        }

        .cover-ph-author {
            font-family: var(--font-sans);
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.8;
            line-height: 1.35;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .cover-ph-title {
            font-family: var(--font-serif);
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.3;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            word-break: break-word;
            margin: 8px 0;
        }

        .cover-ph-rule {
            width: 28px;
            height: 1.5px;
            margin: 0 auto;
            background: currentColor;
            opacity: 0.45;
            border-radius: 2px;
        }

        .book-cover-trigger {
            margin-top: 10px;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 10px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--ink-soft);
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .book-cover-trigger:hover {
            background: var(--accent-wash);
            border-color: rgba(196, 109, 75, 0.3);
            color: var(--accent-deep);
        }

        .book-details-col {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        /* Редактор ссылки на обложку */
        .book-cover-editor {
            margin-top: 18px;
            padding: 15px 16px;
            background: var(--bg);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-lg);
        }

        .book-cover-editor-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--ink-soft);
            margin-bottom: 8px;
        }

        .book-cover-editor-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .book-cover-editor-row .inline-input {
            flex: 1;
            min-width: 0;
            font-size: 13.5px;
            padding: 8px 11px;
        }

        .cover-auto-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(196, 109, 75, 0.32);
            background: var(--accent-wash);
            color: var(--accent-deep);
            font-family: var(--font-sans);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }

        .cover-auto-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #FFFDF9;
        }

        .cover-auto-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .book-cover-hint {
            margin-top: 7px;
            font-size: 12px;
            color: var(--ink-faint);
            line-height: 1.45;
        }

        .book-cover-hint.is-error {
            color: var(--danger);
        }

        .book-cover-hint.is-ok {
            color: var(--sage-deep);
        }

        .cover-candidates {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .cover-candidate-btn {
            width: 52px;
            aspect-ratio: 2 / 3;
            padding: 0;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid transparent;
            background: var(--bg-warm);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.15s, transform 0.12s;
        }

        .cover-candidate-btn:hover {
            border-color: var(--accent-soft);
            transform: translateY(-2px);
        }

        .cover-candidate-btn.is-selected {
            border-color: var(--accent);
        }

        .cover-candidate-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .book-cover-editor-actions {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .book-cover-editor-right {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .book-cover-editor button.editor-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
            padding: 7px 13px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            font-family: var(--font-sans);
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .book-cover-editor button.cover-remove-btn {
            background: transparent;
            color: var(--danger);
            border-color: rgba(174, 79, 75, 0.25);
        }

        .book-cover-editor button.cover-remove-btn:hover {
            background: var(--danger-wash);
        }

        .book-cover-editor button.cancel-btn {
            border-color: var(--line-strong);
        }

        .book-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .book-author {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 14.5px;
            color: var(--accent-deep);
        }

        .book-readers {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .reader-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--ink-faint);
            border: 1px solid var(--line);
        }

        .reader-tag.is-read {
            background: var(--sage-wash);
            color: var(--sage-deep);
            border-color: rgba(109, 139, 104, 0.25);
        }

        .book-annotation-card {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
        }

        .book-annotation-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--ink-faint);
            margin-bottom: 10px;
        }

        .book-annotation {
            margin: 0;
            color: var(--ink);
            line-height: 1.75;
            font-size: 15px;
            max-width: 58ch;
            white-space: pre-wrap;
        }

        .book-annotation.is-empty {
            color: var(--ink-soft);
            font-style: italic;
            font-family: var(--font-serif);
            font-size: 14.5px;
        }

        .book-annotation-edit {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            font-family: var(--font-sans);
            font-size: 14.5px;
            line-height: 1.65;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            background: var(--surface);
        }

        .book-modal-actions {
            margin-top: 18px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .book-modal-actions button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid transparent;
            padding: 9px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            font-family: var(--font-sans);
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }

        .book-modal-actions button:active {
            transform: scale(0.98);
        }

        .book-modal-actions .edit {
            background: var(--accent-wash);
            border-color: rgba(196, 109, 75, 0.25);
            color: var(--accent-deep);
        }

        .book-modal-actions .edit:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #FFFDF9;
        }

        .book-modal-actions .cancel-btn {
            border-color: var(--line-strong);
        }

        /* ===== HISTORY TIMELINE ===== */
        .history-list {
            display: flex;
            flex-direction: column;
        }

        .history-item {
            position: relative;
            padding: 0 0 18px 22px;
            border-left: 1px solid var(--line-strong);
            margin-left: 6px;
        }

        .history-item:last-child {
            padding-bottom: 2px;
            border-left-color: transparent;
        }

        .history-item::before {
            content: "";
            position: absolute;
            left: -5px;
            top: 4px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--surface);
        }

        .history-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
            margin-bottom: 3px;
        }

        .history-desc {
            font-size: 14px;
            color: var(--ink);
            line-height: 1.5;
        }

        .history-empty,
        .history-loading,
        .history-error {
            text-align: center;
            color: var(--ink-soft);
            padding: 28px 0;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .modal-header {
                padding: 18px 18px 14px;
            }
            .modal-body {
                padding: 16px 18px 20px;
            }
            .modal-box--book .modal-header h3 {
                font-size: 20px;
            }
            .book-card-layout {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .book-cover-col {
                width: 154px;
                margin: 0 auto;
            }
            .book-cover-editor-row {
                flex-direction: column;
                align-items: stretch;
            }
            .cover-auto-btn {
                justify-content: center;
            }
            .book-annotation-card {
                padding: 16px;
            }
        }
    </style>
</head>
