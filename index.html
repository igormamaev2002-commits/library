<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Домашняя библиотека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: #FFF5EE;
    margin: 20px;
}

@media (max-width: 600px) {
    body {
        margin: 10px;
    }
}

thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #2c3e50;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    white-space: normal;
    word-break: break-word;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h2 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.10);

    table-layout: fixed; /* 🔥 ВАЖНО */
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 75vh;
    -webkit-overflow-scrolling: touch;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.10);
}

/* Скроллбар не перекрывает шапку */
.table-wrapper::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.table-wrapper::-webkit-scrollbar-track {
    background: transparent;
    margin-top: 45px; /* отступ = высота шапки */
    border-radius: 8px;
}

.table-wrapper::-webkit-scrollbar-thumb {
    background: #b0bec5;
    border-radius: 8px;
}

.table-wrapper::-webkit-scrollbar-thumb:hover {
    background: #90a4ae;
}

.table-wrapper table {
    box-shadow: none;
    border-radius: 0;
    min-width: 420px;
}

/* # */
th:nth-child(1), td:nth-child(1) {
    width: 36px;
}

/* Автор / Книга */
th:nth-child(2), td:nth-child(2) {
    width: auto;
}

/* Игорь */
th:nth-child(3), td:nth-child(3) {
    width: 62px;
    text-align: center;
    vertical-align: middle;
    padding: 10px 0;
}

/* Ира */
th:nth-child(4), td:nth-child(4) {
    width: 62px;
    text-align: center;
    vertical-align: middle;
    padding: 10px 0;
}

/* Действия */
th:nth-child(5), td:nth-child(5) {
    width: 90px;
}

/* 👉 ВЕРТИКАЛЬНЫЕ ЛИНИИ */
th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    border-right: 1px solid #ddd;
        overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

td:nth-child(2), td.book-cell {
    white-space: normal;
    word-break: break-word;
}

th:last-child, td:last-child {
    border-right: none;
}

th {
    background: #2c3e50;
    color: white;
}

tr:hover {
    background: #f9fbfc;
}

/* группировка */
.author-row {
    background: #ecf0f1;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s;
}

.author-row:hover {
    background: #e2e8ea;
}

.author-row td {
    background: inherit;
    border-right: 1px solid #ecf0f1;
    transition: background 0.15s;
}

.hidden {
    display: none;
}

.actions button {
    margin-right: 3px;
    padding: 5px 7px;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    transition: opacity 0.15s, transform 0.1s;
    font-size: 14px;
}

.actions button:hover {
    opacity: 0.82;
    transform: scale(1.05);
}

.actions button:active {
    transform: scale(0.97);
}

.edit { background: #3498db; color: white; }
.save { background: #27ae60; color: white; }
.cancel-btn { background: #95a5a6; color: white; }
.delete { background: #e74c3c; color: white; }

tr.editing td {
    background: #f0f7ff;
}

.inline-input {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid #3498db;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
    outline: none;
    white-space: normal;
    word-break: break-word;
}

.inline-input:focus {
    box-shadow: 0 0 0 2px rgba(52,152,219,0.2);
}

.form, .search {
    margin-top: 15px;
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.form input {
    min-width: 120px;
}

@media (max-width: 600px) {
    .form {
        flex-direction: column;
    }
    .form button.add {
        width: 100%;
    }
}

input {
    padding: 8px 12px;
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 10px;
    transition: border-color 0.18s, box-shadow 0.18s;
    outline: none;
}

input:focus {
    border-color: #3498db;
    box-shadow: 0 0 0 3px rgba(52,152,219,0.12);
}

button.add {
    background: #27ae60;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.18s, transform 0.1s;
}

button.add:hover {
    background: #229a55;
}

button.add:active {
    transform: scale(0.97);
}

#stats {
    margin-top: 20px;
    padding: 14px 16px;
    background: white;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    font-size: 14px;
    color: #555;
}

.read-stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.read-badge {
    background: #f4f6f8;
    border: 1px solid #e0e4e8;
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 13px;
    color: #444;
}

input[type="checkbox"] {
    width: 22px;
    height: 22px;
    cursor: pointer;
}

.add-book-btn {
    margin-left: 10px;
    padding: 3px 9px;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: normal;
    transition: opacity 0.15s, transform 0.1s;
    vertical-align: middle;
}

.add-book-btn:hover {
    opacity: 0.85;
    transform: scale(1.05);
}

.add-book-btn:active {
    transform: scale(0.97);
}

.inline-add-row td {
    background: #f0fff4;
    border-bottom: 2px solid #27ae60;
}

.inline-add-row .inline-input {
    border-color: #27ae60;
}

.inline-add-row .inline-input:focus {
    box-shadow: 0 0 0 2px rgba(39,174,96,0.2);
}

/* Кнопка истории */
.title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.history-btn {
    background: #34495e;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
}

.history-btn:hover {
    opacity: 0.85;
    transform: scale(1.03);
}

.history-btn:active {
    transform: scale(0.97);
}

/* Модальное окно истории */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.modal-overlay.hidden {
    display: none;
}

.modal-box {
    background: white;
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
}

.modal-header h3 {
    margin: 0;
    font-size: 17px;
}

.modal-close {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: #888;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
}

.modal-close:hover {
    background: #f0f0f0;
}

.modal-body {
    padding: 12px 20px 20px;
    overflow-y: auto;
}

.history-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
}

.history-item:last-child {
    border-bottom: none;
}

.history-time {
    font-size: 12px;
    color: #999;
    margin-bottom: 2px;
}

.history-desc {
    font-size: 14px;
    color: #333;
}

.history-empty, .history-loading, .history-error {
    text-align: center;
    color: #888;
    padding: 20px 0;
}

/* Кликабельное название книги */
.book-title-link {
    cursor: pointer;
    transition: color 0.15s;
}

.book-title-link:hover {
    color: #3498db;
    text-decoration: underline;
}

/* Значок наличия аннотации рядом с названием книги */
.annotation-icon {
    display: inline-block;
    margin-left: 6px;
    font-size: 13px;
    vertical-align: middle;
    opacity: 0.75;
    cursor: default;
}

/* Карточка книги в модалке */
.book-author {
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 10px;
}

.book-annotation {
    color: #444;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
}

.book-annotation-edit {
    width: 100%;
    box-sizing: border-box;
    resize: vertical;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
}

.book-modal-actions {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

.book-modal-actions button {
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: opacity 0.15s, transform 0.1s;
}

.book-modal-actions button:hover {
    opacity: 0.85;
    transform: scale(1.03);
}

/* Стили для индикатора синхронизации */
#syncStatus {
    font-size: 14px;
    margin-left: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: #f0f4f8;
    transition: all 0.2s;
    white-space: nowrap;
}
#syncStatus.saving {
    color: #f39c12;
    background: #fef9e7;
}
#syncStatus.saved {
    color: #27ae60;
    background: #eafaf1;
}
#syncStatus.error {
    color: #e74c3c;
    background: #fdedec;
}
</style>

</head>

<body>

<div class="container">
<div class="title-row">
<h2>📚 Домашняя библиотека</h2>
<span id="syncStatus" class="saved">Синхронизировано</span>
<button class="history-btn" onclick="openHistory()">🕓 История изменений</button>
</div>

<div id="historyModal" class="modal-overlay hidden">
<div class="modal-box">
<div class="modal-header">
<h3>🕓 Последние изменения</h3>
<button class="modal-close" onclick="closeHistory()">✖</button>
</div>
<div id="historyList" class="modal-body"></div>
</div>
</div>

<div id="bookModal" class="modal-overlay hidden">
<div class="modal-box">
<div class="modal-header">
<h3 id="bookModalTitle">📖 Книга</h3>
<button class="modal-close" onclick="closeBookDetails()">✖</button>
</div>
<div id="bookModalBody" class="modal-body"></div>
</div>
</div>

<div class="search">
<input id="search" placeholder="Поиск..." oninput="filter()">
</div>

<div class="form">
<input id="author" placeholder="Автор">
<input id="book" placeholder="Книга">
<button class="add" onclick="add()">Добавить</button>
</div>


<div class="table-wrapper">
<table>
<thead>
<tr>
<th>#</th>
<th>Автор / Книга</th>
<th>Игорь</th>
<th>Ира</th>
<th>Действия</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>


<div id="stats"></div>


<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyALTvJQJNtiPHVD0412yqehh5M6m_dBsH_rx_Qbl9rah8yOrNzA3evKaHqu50wX8bzmQ/exec";
let DATA = [];

const syncStatus = document.getElementById('syncStatus');

function setSyncStatus(state) {
    // Убираем все классы
    syncStatus.classList.remove('saving', 'saved', 'error');
    // Добавляем нужный
    syncStatus.classList.add(state);

    const texts = {
        saving: 'Идёт синхронизация…',
        saved: 'Синхронизировано',
        error: 'Ошибка синхронизации'
    };
    syncStatus.textContent = texts[state] || texts.saved;

    // Автосброс ошибки через 3 секунды
    if (state === 'error') {
        clearTimeout(window.syncErrorTimeout);
        window.syncErrorTimeout = setTimeout(() => setSyncStatus('saved'), 3000);
    }
}

async function load() {
    setSyncStatus('saving');
    try {
        const res = await fetch(API_URL);
        DATA = await res.json();
        setSyncStatus('saved');
        applyFilters();
    } catch (err) {
        setSyncStatus('error');
        console.error('Load error:', err);
    }
}

function groupByAuthor(data) {
    const map = {};
    data.forEach(item => {
        if (!map[item.author]) map[item.author] = [];
        map[item.author].push(item);
    });
    return map;
}

function render(data) {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    const grouped = groupByAuthor(data);
    let index = 1;

    for (const author in grouped) {
        const authorId = "author_" + index;

        // строка автора
        const trAuthor = document.createElement("tr");
        trAuthor.className = "author-row " + authorId;
        trAuthor.dataset.group = authorId;
        trAuthor.onclick = () => toggle(author);

        trAuthor.innerHTML = `
            <td>${index++}</td>
            <td colspan="3">👤 ${author} <button class="add-book-btn" onclick="event.stopPropagation(); addBookToAuthor('${author.replace(/'/g, "\\'")}', this)">+ книга</button></td>
            <td></td>
        `;
        tbody.appendChild(trAuthor);

        // книги автора
        grouped[author].forEach(item => {
            tbody.appendChild(buildBookRow(item, authorId));
        });
    }
    updateStats(data);
}

let activeAuthor = null;
let currentSearch = "";


function toggle(authorName) {
    if (activeAuthor === authorName) {
        activeAuthor = null; // сброс
    } else {
        activeAuthor = authorName;
    }

    applyFilters();
}

async function add() {
    const author = authorInput.value.trim();
    const book = bookInput.value.trim();

    if (!author || !book) {
        alert("Нужен автор и книга");
        return;
    }

    // Оптимистично добавляем локально
    const tempId = Date.now(); // временный id
    DATA.push({ id: tempId, author, book, igor: false, ira: false });
    authorInput.value = "";
    bookInput.value = "";
    applyFilters();

    setSyncStatus('saving');
    try {
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "add", author, book })
        });
        setSyncStatus('saved');
        load(); // обновляем id с сервера
    } catch (err) {
        setSyncStatus('error');
        DATA = DATA.filter(x => x.id !== tempId);
        applyFilters();
        alert("Ошибка при добавлении");
    }
}

async function remove(id) {
    // Оптимистично удаляем локально
    const backup = DATA.slice();
    DATA = DATA.filter(x => x.id !== id);
    applyFilters();

    setSyncStatus('saving');
    try {
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "delete", id })
        });
        setSyncStatus('saved');
        load(); // синхронизируем id (после удаления они сдвигаются)
    } catch (err) {
        setSyncStatus('error');
        DATA = backup;
        applyFilters();
        alert("Ошибка при удалении");
    }
}

function buildBookRow(item, authorId) {
    const tr = document.createElement("tr");
    tr.className = authorId;
    tr.dataset.id = item.id;

    const hasAnnotation = item.annotation && item.annotation.trim();
    const annotationIcon = hasAnnotation
        ? `<span class="annotation-icon" title="Есть аннотация">📝</span>`
        : "";

    tr.innerHTML = `
    <td colspan="2" class="book-cell"><span class="book-title-link" onclick="openBookDetails(${item.id})">${item.book}</span>${annotationIcon}</td>
    <td>
        <input type="checkbox"
            ${item.igor ? "checked" : ""}
            onchange="toggleRead(${item.id}, 'igor', this.checked)">
    </td>
    <td>
        <input type="checkbox"
            ${item.ira ? "checked" : ""}
            onchange="toggleRead(${item.id}, 'ira', this.checked)">
    </td>
    <td class="actions">
        <button class="edit" onclick="startEdit(${item.id})">✏️</button>
        <button class="delete" onclick="remove(${item.id})">🗑</button>
    </td>
    `;
    return tr;
}

// Точечно обновляет значок аннотации у конкретной строки, не перерисовывая
// всю таблицу — чтобы значок появлялся/пропадал сразу после сохранения.
function refreshAnnotationIcon(id) {
    const tr = document.querySelector(`tr[data-id="${id}"]`);
    if (!tr) return;

    const item = DATA.find(x => x.id === id);
    if (!item) return;

    const titleLink = tr.querySelector(".book-title-link");
    if (!titleLink) return; // строка сейчас в режиме редактирования — не трогаем

    const hasAnnotation = item.annotation && item.annotation.trim();
    let iconEl = tr.querySelector(".annotation-icon");

    if (hasAnnotation && !iconEl) {
        iconEl = document.createElement("span");
        iconEl.className = "annotation-icon";
        iconEl.title = "Есть аннотация";
        iconEl.textContent = "📝";
        titleLink.after(iconEl);
    } else if (!hasAnnotation && iconEl) {
        iconEl.remove();
    }
}

function startEdit(id) {
    const item = DATA.find(x => x.id === id);
    const tr = document.querySelector(`tr[data-id="${id}"]`);
    if (!tr) return;

    // Find the author row above to get current author value
    let authorRow = tr.previousElementSibling;
    while (authorRow && !authorRow.classList.contains("author-row")) {
        authorRow = authorRow.previousElementSibling;
    }
    const currentAuthor = item.author;

    tr.classList.add("editing");
    tr.innerHTML = `
    <td class="book-cell" colspan="2">
        <input class="inline-input" id="edit-author-${id}" value="${currentAuthor}" placeholder="Автор" style="margin-bottom:4px">
        <input class="inline-input" id="edit-book-${id}" value="${item.book}" placeholder="Книга">
    </td>
    <td>
        <input type="checkbox"
            ${item.igor ? "checked" : ""}
            onchange="toggleRead(${item.id}, 'igor', this.checked)">
    </td>
    <td>
        <input type="checkbox"
            ${item.ira ? "checked" : ""}
            onchange="toggleRead(${item.id}, 'ira', this.checked)">
    </td>
    <td class="actions">
        <button class="save" onclick="saveEdit(${id})">💾</button>
        <button class="cancel-btn" onclick="cancelEdit(${id})">✖</button>
    </td>
    `;
    document.getElementById(`edit-book-${id}`).focus();
}

async function cancelEdit(id) {
    applyFilters();
}

async function saveEdit(id) {
    const author = document.getElementById(`edit-author-${id}`).value.trim();
    const book   = document.getElementById(`edit-book-${id}`).value.trim();

    if (!author || !book) {
        alert("Нужен автор и книга");
        return;
    }

    const item = DATA.find(x => x.id === id);
    const backup = { ...item };
    item.author = author;
    item.book = book;
    applyFilters();

    setSyncStatus('saving');
    try {
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "update", id, author, book })
        });
        setSyncStatus('saved');
    } catch (err) {
        setSyncStatus('error');
        Object.assign(item, backup);
        applyFilters();
        alert("Ошибка при редактировании");
    }
}

async function edit(id) {
    startEdit(id);
}

async function toggleRead(id, field, value) {
    // Оптимистично обновляем локально
    const item = DATA.find(x => x.id === id);
    const backup = item[field];
    item[field] = value;
    updateStats(DATA.slice(1));

    setSyncStatus('saving');
    try {
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "toggle", id, field, value })
        });
        setSyncStatus('saved');
    } catch (err) {
        setSyncStatus('error');
        item[field] = backup;
        updateStats(DATA.slice(1));
        alert("Ошибка при изменении");
    }
}

function filter() {
    currentSearch = document.getElementById("search").value.toLowerCase();

    applyFilters();
}

function applyFilters() {
    let data = DATA.slice(1);

    // если выбран автор → показываем ВСЕ его книги (игнорируем поиск)
    if (activeAuthor) {
        data = data.filter(item => item.author === activeAuthor);
    } else if (currentSearch) {
        data = data.filter(item =>
            (item.author + item.book).toLowerCase().includes(currentSearch)
        );
    }

    render(data);
}

function updateStats(data) {
    const booksCount = data.length;

    const authors = new Set(data.map(item => item.author));
    const authorsCount = authors.size;

    const igorRead = data.filter(item => item.igor).length;
    const iraRead  = data.filter(item => item.ira).length;

    document.getElementById("stats").innerHTML =
        `📚 Книг: <b>${booksCount}</b> &nbsp;|&nbsp; 👤 Авторов: <b>${authorsCount}</b>` +
        `<div class="read-stats">` +
        `<span class="read-badge">Игорь прочитал: <b>${igorRead}</b> из ${booksCount}</span>` +
        `<span class="read-badge">Ира прочитала: <b>${iraRead}</b> из ${booksCount}</span>` +
        `</div>`;
}

const authorInput = document.getElementById("author");
const bookInput = document.getElementById("book");

function addBookToAuthor(author, btn) {
    // Если форма уже открыта для этого автора — закрываем
    const authorRow = btn.closest("tr");
    const existingForm = authorRow.nextElementSibling;
    if (existingForm && existingForm.classList.contains("inline-add-row")) {
        existingForm.remove();
        return;
    }

    // Убираем другие открытые формы
    document.querySelectorAll(".inline-add-row").forEach(r => r.remove());

    const formId = "inline-add-" + Date.now();
    const tr = document.createElement("tr");
    tr.className = "inline-add-row";
    tr.innerHTML = `
        <td colspan="2" class="book-cell">
            <input class="inline-input" id="${formId}" placeholder="Название книги">
        </td>
        <td colspan="2"></td>
        <td class="actions">
            <button class="save" onclick="submitInlineAdd('${author.replace(/'/g, "\\'")}', '${formId}')">💾</button>
            <button class="cancel-btn" onclick="this.closest('tr').remove()">✖</button>
        </td>
    `;
    authorRow.after(tr);
    document.getElementById(formId).focus();

    document.getElementById(formId).addEventListener("keydown", e => {
        if (e.key === "Enter") submitInlineAdd(author, formId);
        if (e.key === "Escape") tr.remove();
    });
}

async function submitInlineAdd(author, formId) {
    const input = document.getElementById(formId);
    if (!input) return;
    const book = input.value.trim();
    if (!book) { input.focus(); return; }

    const tr = input.closest("tr");

    const tempId = Date.now();
    DATA.push({ id: tempId, author, book, igor: false, ira: false });
    tr.remove();
    applyFilters();

    setSyncStatus('saving');
    try {
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "add", author, book })
        });
        setSyncStatus('saved');
        load();
    } catch (err) {
        setSyncStatus('error');
        DATA = DATA.filter(x => x.id !== tempId);
        applyFilters();
        alert("Ошибка при добавлении");
    }
}

async function openHistory() {
    const modal = document.getElementById("historyModal");
    const list = document.getElementById("historyList");

    modal.classList.remove("hidden");
    list.innerHTML = `<div class="history-loading">Загрузка...</div>`;

    try {
        const res = await fetch(`${API_URL}?type=history`);
        const history = await res.json();
        renderHistory(history);
    } catch (err) {
        list.innerHTML = `<div class="history-error">Не удалось загрузить историю</div>`;
    }
}

function closeHistory() {
    document.getElementById("historyModal").classList.add("hidden");
}

function renderHistory(history) {
    const list = document.getElementById("historyList");

    if (!history || !history.length) {
        list.innerHTML = `<div class="history-empty">Изменений пока нет</div>`;
        return;
    }

    list.innerHTML = history.map(item => {
        const date = new Date(item.time);
        const formatted = date.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });

        return `
            <div class="history-item">
                <div class="history-time">${formatted}</div>
                <div class="history-desc">${item.description}</div>
            </div>
        `;
    }).join("");
}

function openBookDetails(id) {
    const item = DATA.find(x => x.id === id);
    if (!item) return;

    document.getElementById("bookModalTitle").textContent = "📖 " + item.book;

    const hasAnnotation = item.annotation && item.annotation.trim();
    const annotationText = hasAnnotation
        ? item.annotation
        : "Аннотация не найдена. Можно добавить вручную.";

    const body = document.getElementById("bookModalBody");
    body.innerHTML = `
        <div class="book-author">👤 ${item.author}</div>
        <p id="bookAnnotationText" class="book-annotation">${annotationText}</p>
        <textarea id="bookAnnotationEdit" class="inline-input book-annotation-edit hidden" rows="5">${item.annotation || ""}</textarea>
        <div class="book-modal-actions">
            <button class="edit" id="bookAnnotationEditBtn" onclick="startEditAnnotation()">✏️ Редактировать</button>
            <button class="save hidden" id="bookAnnotationSaveBtn" onclick="saveAnnotation(${id})">💾 Сохранить</button>
        </div>
    `;

    document.getElementById("bookModal").classList.remove("hidden");
}

function closeBookDetails() {
    document.getElementById("bookModal").classList.add("hidden");
}

function startEditAnnotation() {
    document.getElementById("bookAnnotationText").classList.add("hidden");
    document.getElementById("bookAnnotationEdit").classList.remove("hidden");
    document.getElementById("bookAnnotationEditBtn").classList.add("hidden");
    document.getElementById("bookAnnotationSaveBtn").classList.remove("hidden");
    document.getElementById("bookAnnotationEdit").focus();
}

async function saveAnnotation(id) {
    const textarea = document.getElementById("bookAnnotationEdit");
    const annotation = textarea.value.trim();

    const item = DATA.find(x => x.id === id);
    const backup = item.annotation;
    item.annotation = annotation;

    // Обновляем значок и закрываем модалку сразу, не дожидаясь ответа сервера
    refreshAnnotationIcon(id);
    closeBookDetails();

    setSyncStatus('saving');
    try {
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "updateAnnotation", id, annotation })
        });
        setSyncStatus('saved');
    } catch (err) {
        setSyncStatus('error');
        item.annotation = backup;
        refreshAnnotationIcon(id);
        alert("Ошибка при сохранении аннотации");
    }
}

// Закрытие по клику на фон и по Escape
document.getElementById("bookModal").addEventListener("click", (e) => {
    if (e.target.id === "bookModal") closeBookDetails();
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        closeHistory();
        closeBookDetails();
    }
});

load();
</script>

</body>
</html>
